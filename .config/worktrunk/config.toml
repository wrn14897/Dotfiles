[[pre-start]]
setup = """
echo '🔧 Setting up worktree...'

# Symlink .env.local from primary worktree
if [ -f {{ primary_worktree_path }}/.env.local ]; then
  ln -sf {{ primary_worktree_path }}/.env.local {{ worktree_path }}/.env.local
  echo '✅ Symlinked .env.local'
fi

# Symlink node_modules
if [ -d {{ primary_worktree_path }}/node_modules ]; then
  ln -sf {{ primary_worktree_path }}/node_modules {{ worktree_path }}/node_modules
  echo '✅ Symlinked node_modules'
fi

# Symlink .volumes from primary worktree
if [ -d {{ primary_worktree_path }}/.volumes ]; then
  ln -sf {{ primary_worktree_path }}/.volumes {{ worktree_path }}/.volumes
  echo '✅ Symlinked .volumes'
fi

echo '🚀 Worktree ready!'
"""

[[pre-start]]
install = """
# Skip install for PR review (branch already exists on remote)
if git rev-parse --verify "origin/$(git rev-parse --abbrev-ref HEAD)" >/dev/null 2>&1; then
  echo "Existing remote branch — skipping install"
  exit 0
fi

if [ -f Makefile ]; then
  make
elif [ -f pnpm-lock.yaml ]; then
  pnpm install
elif [ -f package-lock.json ]; then
  npm ci
elif [ -f yarn.lock ]; then
  yarn install
elif [ -f bun.lockb ]; then
  bun install
elif [ -f Cargo.toml ]; then
  cargo build
elif [ -f go.mod ]; then
  go mod download
elif [ -f pyproject.toml ]; then
  uv sync
elif [ -f requirements.txt ]; then
  pip install -r requirements.txt
fi
"""

[pre-remove]
cleanup-opencode = """
set -euo pipefail
worktree_dir="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "{{ worktree_path }}")"
opencode session list --format json \
  | jq -r --arg dir "$worktree_dir" '
      .[]
      | select(
          (.directory | sub("/+$"; "")) == $dir
          or (.directory | startswith($dir + "/"))
        )
      | .id' \
  | while read -r id; do
      echo "Deleting OpenCode session: $id (worktree=$worktree_dir)"
      opencode session delete "$id" || { echo "FAILED to delete $id" >&2; exit 1; }
    done
"""

[commit.generation]
command = "CLAUDECODE= MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"


